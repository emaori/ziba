# Runs Ziba from its published image: two services, the application and its
# database. Nothing is built here — see the Dockerfile for that.
#
# Secrets come from a .env file next to this one — see .env.example.

services:
  ziba-db:
    image: postgres:18-alpine
    container_name: ziba-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ziba
      POSTGRES_USER: ${POSTGRES_USER:-ziba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      # Loopback only: the database is never exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ziba-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Ziba itself: the web interface and the schedule, in one process.
  #
  # The published image, not a build: the image is produced from the Dockerfile
  # by the release workflow, and compose only runs it. `make image` builds the
  # same tag locally when working on the code, and compose uses whatever is
  # there before reaching for the registry.
  ziba-api:
    image: ghcr.io/emaori/ziba:${ZIBA_VERSION:-latest}
    container_name: ziba-api
    restart: unless-stopped
    depends_on:
      ziba-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # These override whatever .env holds, because inside the network the
      # other services are reached by name, not on loopback. The values in .env
      # are for running the binary outside Docker during development.
      # 5432, not POSTGRES_PORT: that one is the host side of the mapping
      # below, and inside the network the database always listens on 5432.
      ZIBA_DATABASE_URL: postgres://${POSTGRES_USER:-ziba}:${POSTGRES_PASSWORD}@ziba-db:5432/ziba?sslmode=disable
      # The digest is scheduled in local time, so the container has to know
      # which local. Without this it would run on UTC.
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # The hand-edited files, mounted read-only
      - ./config:/app/config:ro
      # The model journal, when ZIBA_MODEL_JOURNAL is on, so it can be read from
      # here rather than only inside the container.
      - ./log:/app/log
    ports:
      # ZIBA_PORT is the host side only. The container always listens on 8080 —
      # EXPOSE, the image's healthcheck and this mapping all say so, and the
      # program has no setting for it. Passing it in would be harmless.
      #
      # ZIBA_BIND is which interface it appears on, defaulting to all of them so
      # a deployed instance is reachable from any devices on the network.
      - "${ZIBA_BIND:-0.0.0.0}:${ZIBA_PORT:-8080}:8080"


volumes:
  ziba-db-data:
