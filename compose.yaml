# Local and homeserver deployment.
#
# Only the database is defined for now; ziba-api and ziba-playwright are added
# when there is a server to run and a site that needs a browser.
#
# Secrets come from a .env file next to this one — see .env.example. That file
# is git-ignored.

services:
  ziba-db:
    image: postgres:17-alpine
    container_name: ziba-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ziba
      POSTGRES_USER: ${POSTGRES_USER:-ziba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      # Loopback only: the database is never exposed on the network. Note that
      # "localhost" here is the Docker host — the homeserver, not the machine
      # running the compose command. Reach it from a development machine with
      # `make db-tunnel`.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ziba-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Ziba itself: the web interface and the schedule, in one process.
  ziba-api:
    build:
      context: .
      args:
        VERSION: ${ZIBA_VERSION:-dev}
    image: ziba-api:local
    container_name: ziba-api
    restart: unless-stopped
    depends_on:
      ziba-db:
        condition: service_healthy
      ziba-playwright:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # These override whatever .env holds, because inside the network the
      # other services are reached by name, not on loopback. The values in .env
      # are for running the binary outside Docker during development.
      ZIBA_DATABASE_URL: postgres://${POSTGRES_USER:-ziba}:${POSTGRES_PASSWORD}@ziba-db:5432/ziba?sslmode=disable
      ZIBA_RENDER_URL: http://ziba-playwright:3000
      # The digest is scheduled in local time, so the container has to know
      # which local. Without this it would run on UTC.
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # The hand-edited files, mounted read-only: editing them and restarting is
      # the whole workflow, no rebuild involved.
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:${ZIBA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Headless Chromium, for sites that build their markup in the browser.
  #
  # A separate container is not an architectural boundary — Ziba is a monolith —
  # but it keeps Chromium's crashes and its appetite for memory out of the main
  # process, which is the whole reason it is here.
  ziba-playwright:
    image: ghcr.io/browserless/chromium:latest
    container_name: ziba-playwright
    restart: unless-stopped
    environment:
      # One page at a time is plenty: collection visits a handful of sites on a
      # nightly schedule, and each extra concurrent browser costs real memory.
      CONCURRENT: "1"
      TIMEOUT: "60000"
      TOKEN: ""
    ports:
      - "127.0.0.1:${RENDER_PORT:-3000}:3000"
    healthcheck:
      # /pressure reports whether the browser pool can accept work, which is the
      # question. The root path answers 404, so checking it would mark a
      # perfectly healthy container as broken.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/pressure > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  ziba-db-data:
