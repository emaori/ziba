# The sources Ziba reads. Hand-edited: adding a source is adding four lines.
#
# type:    rss | newsletter    (pdf is deferred to v2; website was removed)
# enabled: optional, defaults to true — set false to stop reading a source
#          without losing the articles already collected from it.
#
# roundup: rss only. For a feed that publishes issues of a link digest rather
#          than articles — each entry pointing at a page that lists other
#          people's writing. Ziba opens the issue and collects what it links to,
#          instead of storing the table of contents. See .NET Ketchup below.
#
# categories: what this source is about, when you already know. Each name must
#          be one of the interests in interests.yaml. Declaring them means the
#          AI does not guess the subject — it is told — and instead scores how
#          *interesting* each piece is. Such articles are always shown: the
#          relevance threshold does not apply, because you subscribed on
#          purpose. Leave it out and everything is inferred as before.
#
#          A mailbox is one source, so categories there would apply to every
#          newsletter in it. To declare per publication, give each its own
#          folder and add one newsletter source per folder.
#
#          In Gmail a label IS an IMAP folder — "DotNet" is selectable exactly
#          as INBOX is, and a nested label reads as "Parent/Child". No special
#          handling is needed.
#
#          But a labelled message stays in the inbox as well, so a source for
#          INBOX and a source for the label will both collect it. That is worse
#          than duplicated work: sources are read in parallel, whichever stores
#          an article first owns it, and only the owning source's declared
#          categories apply — so the classification would depend on a race.
#          Set the Gmail filter to skip the inbox, or do not configure INBOX.
#
# collect_from: how much history a source contributes on first contact. A
#               duration ("7d", "48h"), a date ("2026-01-01"), or "all" for
#               whatever the source offers. Default is 7d.
#
#               The cutoff is anchored to when the source was first added, not
#               to today, so pausing collection never widens into lost articles.
#               It only bounds what arrives; it never removes what is stored.

sources:
  - name: "Il Post"
    type: rss
    url: "https://www.ilpost.it/feed/"

  - name: "IEEE Spectrum"
    type: rss
    url: "https://spectrum.ieee.org/feeds/feed.rss"

  - name: "Hacker News — front page"
    type: rss
    url: "https://hnrss.org/frontpage"

  # A weekly link digest, not an article feed: every entry is one issue, and the
  # issue page lists ten other people's articles. Marked as a roundup so Ziba
  # reads it for its links rather than storing the table of contents.
  #
  # Its feed carries 277 entries reaching back to April 2021, so without a
  # cutoff it arrives with five years of backlog. Two weeks rather than the
  # default one, because it publishes in weekly batches.
  - name: ".NET Ketchup"
    type: rss
    url: "https://dotnetketchup.com/rss"
    roundup: true
    collect_from: 14d
    # Everything it links is .NET; there is nothing to work out. Declaring it
    # also stops the classifier hiding a piece that never writes the word —
    # which it did to an article about FastEndpoints.
    categories: [".NET"]

  # Communications of the ACM — the eight subject feeds.
  #
  # All eight are DISABLED because Ziba cannot reach them. Every address on
  # cacm.acm.org answers an automated request with a Cloudflare challenge page
  # ("Attention Required!"), verified against each of these eight in turn. A
  # browser gets through; a feed reader does not.
  #
  # Worth recording: this is not the publisher declining to be read. Their
  # robots.txt is served normally and permits everything but the admin area,
  # and it blocks one named AI crawler while leaving ordinary readers allowed.
  # The refusal comes from a bot-detection layer that is stricter than the
  # site's own stated policy. Ziba will not disguise itself to get past it.
  #
  # To use these: check whether they load for you, and if ACM ever allows a
  # personal reader through, set enabled: true. ACM TechNews is a newsletter
  # and would work today through a newsletter source instead.

  - name: "CACM — Architecture & Hardware"
    type: rss
    url: "https://cacm.acm.org/category/architecture-and-hardware/feed"
    enabled: false

  - name: "CACM — AI & Machine Learning"
    type: rss
    url: "https://cacm.acm.org/category/artificial-intelligence-machine-learning/feed"
    enabled: false

  - name: "CACM — Computing Applications"
    type: rss
    url: "https://cacm.acm.org/category/computing-applications/feed"
    enabled: false

  - name: "CACM — Data & Information"
    type: rss
    url: "https://cacm.acm.org/category/data-and-information/feed"
    enabled: false

  - name: "CACM — Security & Privacy"
    type: rss
    url: "https://cacm.acm.org/category/security-and-privacy/feed"
    enabled: false

  - name: "CACM — Software Engineering & Programming Languages"
    type: rss
    url: "https://cacm.acm.org/category/software-engineering-and-programming-languages/feed"
    enabled: false

  - name: "CACM — Systems & Networking"
    type: rss
    url: "https://cacm.acm.org/category/systems-and-networking/feed"
    enabled: false

  - name: "CACM — Theory"
    type: rss
    url: "https://cacm.acm.org/category/theory/feed"
    enabled: false

  # A newsletter mailbox. Credentials are never written here: name the
  # environment variables that hold them and set those in .env.
  #
  # Newsletters are read as link aggregators — the email is kept only as
  # provenance, and what enters Ziba are the articles it links to.
  #
  # A mailbox is read the way a feed is: a window of recent days every run, with
  # duplicates discarded. Ziba never touches the read/unread flag, so mail you
  # have already opened is still collected and mail Ziba has read still looks
  # unread to you.
  #
  # One source per Gmail label, so each can declare what it publishes. The
  # labels must skip the inbox, or the source below collects the same mail and
  # whichever wins the race owns the article — see the note on categories above.
  - name: ".NET newsletters"
    type: newsletter
    url: "imaps://imap.gmail.com:993/"
    categories: [".NET"]
    newsletter:
      folder: "DotNet"
      username_env: ZIBA_IMAP_USER
      password_env: ZIBA_IMAP_PASSWORD
      days: 1
      max_messages: 50

  - name: "AI newsletters"
    type: newsletter
    url: "imaps://imap.gmail.com:993/"
    categories: ["AI"]
    newsletter:
      folder: "AI"
      username_env: ZIBA_IMAP_USER
      password_env: ZIBA_IMAP_PASSWORD
      days: 1
      max_messages: 50

  - name: "Programming newsletters"
    type: newsletter
    url: "imaps://imap.gmail.com:993/"
    categories: ["Programming"]
    newsletter:
      folder: "Programming"
      username_env: ZIBA_IMAP_USER
      password_env: ZIBA_IMAP_PASSWORD
      days: 1
      max_messages: 50

  # Everything not labelled. No categories: what arrives here is unknown, so it
  # is classified like any other source.
  - name: "Newsletters"
    type: newsletter
    url: "imaps://imap.gmail.com:993/"
    newsletter:
      folder: "INBOX"
      username_env: ZIBA_IMAP_USER
      password_env: ZIBA_IMAP_PASSWORD
      days: 1                # days of mail each run reads (default 1)
      max_messages: 50
