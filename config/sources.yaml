# The sources Ziba reads. Hand-edited: adding a source is adding four lines.
#
# type:    rss | website | newsletter    (pdf is deferred to v2)
# enabled: optional, defaults to true — set false to stop reading a source
#          without losing the articles already collected from it.
#
# A `website` source scrapes a page for article links, then each link goes
# through the same full-text retrieval as everything else. Its options:
#
#   link_pattern  regular expression an article address must match. Without it
#                 you collect the site's navigation as well as its articles —
#                 most sites put a date or a section in article addresses.
#   render        fetch through the browser sidecar, for sites that build their
#                 markup in the browser. Slower; only set it when needed.
#   max_links     how many articles one visit collects (default 30).

sources:
  - name: "Il Post"
    type: rss
    url: "https://www.ilpost.it/feed/"

  - name: "IEEE Spectrum"
    type: rss
    url: "https://spectrum.ieee.org/feeds/feed.rss"

  - name: "Hacker News — front page"
    type: rss
    url: "https://hnrss.org/frontpage"

  # A curated .NET link roundup. The feed points outward at other people's
  # posts, which is exactly what we want: each link becomes its own article.
  - name: ".NET Ketchup"
    type: rss
    url: "https://dotnetketchup.com/rss"

  # Communications of the ACM sits behind Cloudflare bot protection. Every feed
  # path answers 403 to a plain request, and a real headless browser is served a
  # CAPTCHA page ("Attention Required! | Cloudflare"). There is no way to read
  # it with what Ziba has, and working around a deliberate access control is not
  # something to build. Left here, disabled, so the decision is not rediscovered.
  #
  # Options, if it matters: an ACM Digital Library subscription may expose an
  # authorised feed, or the ACM TechNews newsletter could be read as a mailbox.
  - name: "Communications of the ACM"
    type: rss
    url: "https://cacm.acm.org/feed/"
    enabled: false

  # A newsletter mailbox. Credentials are never written here: name the
  # environment variables that hold them and set those in .env.
  #
  # Newsletters are read as link aggregators — the email is kept only as
  # provenance, and what enters Ziba are the articles it links to.
  #
  # - name: "Newsletters"
  #   type: newsletter
  #   url: "imaps://imap.example.com:993/"
  #   newsletter:
  #     folder: "INBOX"
  #     username_env: ZIBA_IMAP_USER
  #     password_env: ZIBA_IMAP_PASSWORD
  #     unread_only: true      # default; keeps a nightly run cheap
  #     max_messages: 50
