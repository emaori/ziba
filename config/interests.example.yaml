# What is worth reading. Hand-edited, changes rarely.
#
# This is the starter shipped in the image. It is meant to be replaced: these
# are just some examples.
# Mount your own over /app/config.
#
# threshold: the relevance score (0-100) an article must reach to be summarized
#            and to appear in the daily digest. Below it an article is still
#            collected and browsable in the archive — the AI curates, it does
#            not censor. Raising this makes the digest shorter and cheaper.
#
# priority:  1 is the most important. Used to rank interests against each other.
#
# subtopics: optional. They tell the model what the topic covers, and they are
#            also the entire vocabulary of the offline analyzer, which matches
#            on words. Prefer phrases: "unit testing" is a subject, "testing" is
#            an ordinary English word that will match an article about anything.
#            An interest with no subtopics is invisible to the offline analyzer
#            and perfectly clear to a real model.
#
# note:      free text, and the most useful field here. It describes taste in a
#            way a keyword list cannot.

threshold: 60

interests:
  - topic: "AI"
    priority: 1
    subtopics: ["LLMs", "AI agents", "machine learning", "ML infrastructure"]
    note: "Practical applications and how things actually work. Less interested in funding rounds and industry gossip."

  - topic: "Computer Science"
    priority: 1
    subtopics: ["algorithms", "distributed systems", "programming languages", "research"]
    note: "Ideas with substance, including academic work when it is readable."

  - topic: "Software Architecture"
    priority: 2
    subtopics: ["system design", "databases", "self-hosting", "scalability"]
    note: "Concrete write-ups from people who built the thing, over abstract advice."
