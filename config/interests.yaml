# What is worth reading. Hand-edited, changes rarely.
#
# threshold: the relevance score (0-100) an article must reach to be summarized
#            and to appear in the daily digest. Below it an article is still
#            collected and browsable in the archive — the AI curates, it does
#            not censor. Raising this makes the digest shorter and cheaper.
#
# priority:  1 is the most important. Used to rank interests against each other.
# note:      free text. This is the most useful field: it describes taste in a
#            way a keyword list cannot.

threshold: 60

interests:
  - topic: "AI"
    priority: 1
    subtopics: ["LLMs", "AI agents", "machine learning", "ML infrastructure"]
    note: "Practical applications and how things actually work. Less interested in funding rounds and industry gossip."

  - topic: "Computer Science"
    priority: 1
    subtopics: ["algorithms", "distributed systems", "programming languages", "research"]
    note: "Ideas with substance, including academic work when it is readable."

  - topic: "Software Architecture"
    priority: 2
    subtopics: ["system design", "databases", "self-hosting", "scalability"]
    note: "Concrete write-ups from people who built the thing, over abstract advice."

  - topic: ".NET"
    priority: 2
    subtopics: ["C#", "ASP.NET", "dotnet tooling", "Blazor"]
    note: "Practical .NET development: language features, framework releases, real-world patterns."

  # Deliberately narrower than "Computer Science", which is for ideas: this is
  # the craft — how to write, test and ship code today. An article can be both,
  # and several will be.
  - topic: "Programming"
    priority: 1
    # Phrases, not words. The subtopics double as the offline matcher's
    # vocabulary, and "testing" and "languages" fired on ordinary prose — a
    # research-integrity notice and an article about hexagons both came out as
    # Programming. The same trap as "ai" inside Italian words.
    subtopics: ["programming languages", "unit testing", "developer tooling", "debugging", "refactoring"]
    note: "The craft of writing software: patterns, tooling, and hard-won practice. Prefer a working example over an opinion piece."

  - topic: "Italian and International news"
    priority: 3
    note: "Analysis and context rather than breaking news."
