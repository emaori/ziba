{{define "content"}}
<h1 class="page-title">Reset personalized scoring?</h1>
<section class="settings-section">
  <p>This removes feedback from {{.ScoreFeedbackSummary.Count}} articles and every calibration learned from it.</p>
  <p>Your articles, interests, sources, and original AI scores will not be removed.</p>
  <form method="post" action="/settings/scoring/reset"><input type="hidden" name="csrf_token" value="{{csrfToken}}"><div class="actions"><button class="button danger" type="submit">Reset scoring</button><a class="button secondary" href="/settings/scoring">Cancel</a></div></form>
</section>
{{end}}
